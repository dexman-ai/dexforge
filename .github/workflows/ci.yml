name: CI Validation

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  python-bindings:
    name: Python Bindings (${{ matrix.oem }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        oem:
          - dexforge-ur
          - dexforge-agilex
          - dexforge-franka
          - dexforge-ufactory
          - dexforge-flexiv
          - dexforge-unitree
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Create virtual environment
        run: python -m venv .venv

      - name: Install Python dependencies
        run: |
          source .venv/bin/activate
          python -m pip install --upgrade pip
          python -m pip install maturin pytest hypothesis scipy numpy

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-

      - name: Cache cargo index
        uses: actions/cache@v4
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-index-

      - name: Cache cargo build
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-cargo-build-target-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-build-target-

      - name: Run OEM Rust tests
        run: cargo test --release --manifest-path repos/${{ matrix.oem }}/rust/Cargo.toml

      - name: Verify ssik reference data version
        run: |
          source .venv/bin/activate
          python codegen/ik_test_data.py --check

      - name: Build and install Python bindings
        run: |
          source .venv/bin/activate
          cd repos/${{ matrix.oem }}/python
          python -m maturin develop --release

      - name: Run Python tests
        run: |
          source .venv/bin/activate
          python -m pytest repos/${{ matrix.oem }}/python/tests -v

  codegen-and-core:
    name: Codegen & Core Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Create virtual environment
        run: python -m venv .venv

      - name: Install Python dependencies
        run: |
          source .venv/bin/activate
          python -m pip install --upgrade pip
          python -m pip install pytest numpy sympy $(grep '^ssik==' SSIK_VERSION.txt)

      - name: Verify ssik reference data version
        run: |
          source .venv/bin/activate
          python codegen/ik_test_data.py --check

      - name: Run codegen tests
        run: |
          source .venv/bin/activate
          python -m pytest codegen/tests -v

      - name: Run dexhal Rust tests
        run: cargo test --release --manifest-path repos/dexhal/Cargo.toml

