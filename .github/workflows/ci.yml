name: CI Validation

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  oem-crates:
    name: OEM Driver Crates (${{ matrix.oem }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        oem:
          - dexforge-ur
          - dexforge-agilex
          - dexforge-franka
          - dexforge-ufactory
          - dexforge-flexiv
          - dexforge-unitree
          - dexforge-lerobot
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-registry-

      - name: Cache cargo index
        uses: actions/cache@v4
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-index-

      - name: Cache cargo build
        uses: actions/cache@v4
        with:
          path: repos/${{ matrix.oem }}/target
          key: ${{ runner.os }}-cargo-build-${{ matrix.oem }}-${{ hashFiles('repos/**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-build-${{ matrix.oem }}-

      - name: Run OEM Rust tests
        run: cargo test --release --manifest-path repos/${{ matrix.oem }}/rust/Cargo.toml

  codegen-and-core:
    name: Codegen & Core Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Create virtual environment
        run: python -m venv .venv

      - name: Install Python dependencies
        run: |
          source .venv/bin/activate
          python -m pip install --upgrade pip
          python -m pip install .

      - name: Verify ssik reference data version
        run: |
          source .venv/bin/activate
          python codegen/ik_test_data.py --check

      - name: Run codegen tests
        run: |
          source .venv/bin/activate
          python -m pytest codegen/tests -v

      - name: Build mock driver plugin (cdylib)
        run: cargo build --release -p dexforge-mock-core

      - name: Run dexhal workspace Rust tests (core, mock, plugin)
        run: cargo test --release --workspace

