[package]
name = "dexforge-mock-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
description = "Mock arm driver (vendor \"mock\") for integration testing dexhal clients"
license = "BSD-3-Clause"
publish = false

[lib]
name = "dexforge_mock_core"
path = "src/lib.rs"
crate-type = ["rlib", "cdylib"]

[dependencies]
dexhal = { path = "../.." }
dexhal-plugin = { path = "../../plugin" }
