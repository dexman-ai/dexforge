[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dexforge"
version = "0.1.0"
description = "Agent-driven codegen tooling for dexhal OEM driver crates."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "BSD-3-Clause" }
dependencies = [
    "ssik==1.2.3",
    "sympy",
    "numpy",
    "pin",
    "pytest",
]

[project.optional-dependencies]
# FACTR 2 learned torque observer training (codegen/next/train_next.py).
next = ["torch"]

[tool.setuptools]
packages = ["codegen", "codegen.next"]

[tool.setuptools.package-data]
codegen = ["templates/**/*", "*.md"]

