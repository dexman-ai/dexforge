[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "dexforge"
version = "0.1.0"
description = "Agent-driven codegen tooling for dexhal OEM driver crates."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "BSD-3-Clause" }

[tool.setuptools]
packages = ["codegen"]
