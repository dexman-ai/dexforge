# Manifest of the Rizon10 (`Rizon10`, vendor "flexiv").
#
# Loaded by `Rizon10Driver::new()` through
# `ArmManifest::from_text::<Rizon10, 7, 256>`; see
# repos/dexhal/examples/manifest.yaml for every key. Scaffolded by
# codegen/scaffold.py: `limits.velocity` / `limits.effort` come from the URDF
# <limit> tags. Every `TODO` must be replaced from the OEM data sheet / protocol
# specification (the manifest does not parse until they are).

driver: rizon10               # must equal Rizon10::NAME
version: "0.2"
control_freq_hz: 1000         # rate at which the controller expects commands
control_modes: [joint_pos, joint_vel, joint_torque, cartesian_pose, cartesian_twist, cartesian_wrench]
realtime: true

latency:
  state_staleness_cycles: 1
  command_dispatch_cycles: 1

limits:
  velocity: [1.7453, 1.7453, 2.0944, 2.0944, 3.8397, 3.8397, 3.8397]   # rad/s  (URDF <limit velocity>)
  acceleration: [15.0, 15.0, 20.0, 20.0, 30.0, 30.0, 30.0]   # rad/s^2
  effort: [261.0, 261.0, 123.0, 123.0, 57.0, 57.0, 57.0]   # N*m  (URDF <limit effort>)

has_static_inertials: true

sensing:
  torque: true
  wrench: true
  gripper: true

native:
  cartesian_impedance: true
  cartesian_admittance: false
  joint_impedance: true
  joint_admittance: false
  contact_detection: true
  reflexes: true
  payload: true
  tcp_offset: true
