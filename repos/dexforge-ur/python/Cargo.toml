[package]
name = "dexforge-ur-py"
version = "0.1.0"
edition = "2021"
description = "Python bindings for the dexforge UR OEM repo."
license = "BSD-3-Clause"

[lib]
name = "dexforge_ur"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.23", features = ["extension-module"] }
dexforge-ur-core = { path = "../rust" }
dexhal = { path = "../../../dexhal" }
nalgebra = { version = "0.33", default-features = false, features = ["libm"] }

# Standalone workspace root: keeps cargo from attaching this crate to the parent repo workspace.
[workspace]
