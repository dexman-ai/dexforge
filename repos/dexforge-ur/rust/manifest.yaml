# Manifest of the Ur5 (`Ur5`, vendor "ur").
#
# Loaded by `Ur5Driver::new()` through
# `ArmManifest::from_text::<Ur5, 6, 16>`; see
# dexhal/examples/manifest.yaml for every key. Scaffolded by
# codegen/scaffold.py: `limits.velocity` / `limits.effort` come from the URDF
# <limit> tags. Every `TODO` must be replaced from the OEM data sheet / protocol
# specification (the manifest does not parse until they are).

driver: ur5               # must equal Ur5::NAME
version: "0.2"
control_freq_hz: 500          # rate at which the controller expects commands
control_modes: [joint_pos, joint_vel, cartesian_pose]
realtime: true

latency:
  state_staleness_cycles: 1
  command_dispatch_cycles: 2

limits:
  velocity: [3.15, 3.15, 3.15, 3.2, 3.2, 3.2]   # rad/s  (URDF <limit velocity>)
  acceleration: [15.0, 15.0, 15.0, 15.0, 15.0, 15.0]   # rad/s^2
  effort: [150.0, 150.0, 150.0, 28.0, 28.0, 28.0]   # N*m  (URDF <limit effort>)

has_static_inertials: true

sensing:
  torque: true
  wrench: false
  gripper: false

native:
  cartesian_impedance: false
  cartesian_admittance: true
  joint_impedance: false
  joint_admittance: false
  contact_detection: false
  reflexes: false
  payload: true
  tcp_offset: true
