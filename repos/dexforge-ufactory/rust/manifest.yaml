# Manifest of the Xarm7 (`Xarm7`, vendor "ufactory").
#
# Loaded by `Xarm7Driver::new()` through
# `ArmManifest::from_text::<Xarm7, 7, 128>`; see
# repos/dexhal/examples/manifest.yaml for every key. Scaffolded by
# codegen/scaffold.py: `limits.velocity` / `limits.effort` come from the URDF
# <limit> tags. Every `TODO` must be replaced from the OEM data sheet / protocol
# specification (the manifest does not parse until they are).

driver: xarm7               # must equal Xarm7::NAME
version: "0.2"
control_freq_hz: 250          # rate at which the controller expects commands
control_modes: [joint_pos, joint_vel, joint_torque, cartesian_pose]
realtime: true

latency:
  state_staleness_cycles: 1
  command_dispatch_cycles: 2

limits:
  velocity: [3.14, 3.14, 3.14, 3.14, 3.14, 3.14, 3.14]   # rad/s  (URDF <limit velocity>)
  acceleration: [20.0, 20.0, 20.0, 20.0, 20.0, 20.0, 20.0]   # rad/s^2
  effort: [50.0, 50.0, 32.0, 32.0, 32.0, 20.0, 20.0]   # N*m  (URDF <limit effort>)

has_static_inertials: true

sensing:
  torque: true
  wrench: false
  gripper: true

native:
  cartesian_impedance: false
  cartesian_admittance: true
  joint_impedance: false
  joint_admittance: false
  contact_detection: false
  reflexes: false
  payload: true
  tcp_offset: true
