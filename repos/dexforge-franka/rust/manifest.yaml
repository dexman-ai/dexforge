# Manifest of the Franka Panda (`FrankaPanda`, vendor "franka").
#
# Loaded by `FrankaPandaDriver::new()` through
# `ArmManifest::from_text::<FrankaPanda, 7, 128>`; see
# repos/dexhal/examples/manifest.yaml for every key. Scaffolded by
# codegen/scaffold.py: `limits.velocity` / `limits.effort` come from the URDF
# <limit> tags. Every `TODO` must be replaced from the OEM data sheet / protocol
# specification (the manifest does not parse until they are).

driver: franka_panda               # must equal FrankaPanda::NAME
version: "0.2"
control_freq_hz: 1000         # rate at which the controller expects commands
control_modes: [joint_pos, joint_vel, joint_torque, cartesian_pose, cartesian_twist]
realtime: true

latency:
  state_staleness_cycles: 1
  command_dispatch_cycles: 1

limits:
  velocity: [2.175, 2.175, 2.175, 2.175, 2.61, 2.61, 2.61]   # rad/s  (URDF <limit velocity>)
  acceleration: [15.0, 7.5, 10.0, 12.5, 15.0, 20.0, 20.0]   # rad/s^2
  effort: [87.0, 87.0, 87.0, 87.0, 12.0, 12.0, 12.0]   # N*m  (URDF <limit effort>)
  jerk: [7500.0, 3750.0, 5000.0, 6250.0, 7500.0, 10000.0, 10000.0]   # rad/s^3

has_static_inertials: true

sensing:
  torque: true
  wrench: true
  gripper: true

native:
  cartesian_impedance: true
  cartesian_admittance: false
  joint_impedance: true
  joint_admittance: false
  contact_detection: true
  reflexes: true
  payload: true
  tcp_offset: true
