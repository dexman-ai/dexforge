[package]
name = "dexforge-unitree-py"
version = "0.1.0"
edition = "2021"
description = "Python bindings for the dexforge Unitree OEM repo."
license = "BSD-3-Clause"

[lib]
name = "dexforge_unitree"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.23", features = ["extension-module"] }
dexforge-unitree-core = { path = "../rust" }
nalgebra = { version = "0.33", default-features = false, features = ["libm"] }
