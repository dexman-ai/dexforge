[package]
name = "ssik-py"
version = "0.1.0"
edition = "2021"
description = "Python bindings for ssik-rust analytical inverse kinematics."
license = "BSD-3-Clause"

[lib]
name = "ssik_py"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.23", features = ["extension-module"] }
ssik-rust = { path = ".." }
nalgebra = { version = "0.33", default-features = false, features = ["libm"] }
